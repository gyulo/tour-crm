<!DOCTYPE html>
<!--
  Itinerario personalizado — Claudia Patricia Herrera (familia, 5 pax)
  Martes 28 de julio de 2026 · Seongsu + Itaewon
  Basado en el mapa guardado de Naver: https://naver.me/GkIeDejF
  Los enlaces se generan desde el array STOPS (abajo) — para editar, cambia solo ese array.

  Diseño: Airbnb DESIGN.md (getdesign.md/airbnb)
    Rausch #ff385c · ink #222 · hairline #ddd · lienzo blanco
    radios 8 / 14 / full · un solo nivel de sombra · base de espaciado 4px
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corea octubre · 2 oct</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* colors */
      --primary: #ff385c;
      --primary-active: #e00b41;
      --ink: #222222;
      --body: #3f3f3f;
      --muted: #6a6a6a;
      --muted-soft: #929292;
      --hairline: #dddddd;
      --hairline-soft: #ebebeb;
      --border-strong: #c1c1c1;
      --canvas: #ffffff;
      --surface-soft: #f7f7f7;
      --surface-strong: #f2f2f2;
      --on-primary: #ffffff;

      /* radii */
      --r-xs: 4px; --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 32px; --r-full: 9999px;

      /* spacing (base 4px) */
      --s-xxs: 2px; --s-xs: 4px; --s-sm: 8px; --s-md: 12px;
      --s-base: 16px; --s-lg: 24px; --s-xl: 32px; --s-xxl: 48px; --s-section: 64px;

      /* single shadow tier */
      --shadow: rgba(0,0,0,0.02) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px 0, rgba(0,0,0,0.1) 0 4px 8px 0;

      --font: Inter, 'Airbnb Cereal VF', Circular, -apple-system, BlinkMacSystemFont,
              system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--canvas);
      color: var(--body);
      font-size: 16px; font-weight: 400; line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--s-lg) var(--s-xxl); }

    /* ── Hero ─────────────────────────────────────────────── */
    .hero { padding: var(--s-xl) 0 var(--s-lg); }
    .eyebrow {
      display: inline-block;
      font-size: 11px; font-weight: 600; line-height: 1.18;
      color: var(--on-primary); background: var(--primary);
      border-radius: var(--r-full); padding: 5px 12px;
      margin-bottom: var(--s-base);
    }
    h1 {
      font-size: 28px; font-weight: 700; line-height: 1.2;
      letter-spacing: -0.5px; color: var(--ink);
    }
    .hero .sub {
      font-size: 16px; font-weight: 400; line-height: 1.5;
      color: var(--muted); margin-top: var(--s-sm);
    }
    .hero .brand {
      font-size: 13px; font-weight: 400; line-height: 1.23;
      color: var(--muted-soft); margin-top: var(--s-md);
    }

    /* ── Facts row ────────────────────────────────────────── */
    .facts {
      display: flex; flex-wrap: wrap;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      margin-bottom: var(--s-lg);
    }
    .fact { flex: 1 1 33%; padding: var(--s-base) 0; }
    .fact + .fact { border-left: 1px solid var(--hairline-soft); padding-left: var(--s-base); }
    .fact .k {
      font-size: 8px; font-weight: 700; line-height: 1.25; letter-spacing: 0.32px;
      text-transform: uppercase; color: var(--muted-soft);
    }
    .fact .v {
      font-size: 16px; font-weight: 600; line-height: 1.25;
      color: var(--ink); margin-top: var(--s-xs);
    }

    /* ── Briefing ─────────────────────────────────────────── */
    .brief {
      background: var(--surface-soft);
      border-radius: var(--r-md);
      padding: var(--s-lg);
      margin-bottom: var(--s-xl);
    }
    .brief h2 { font-size: 16px; font-weight: 600; line-height: 1.25; color: var(--ink); margin-bottom: var(--s-md); }
    .brief ul { list-style: none; }
    .brief li {
      font-size: 14px; line-height: 1.43; color: var(--body);
      padding-left: var(--s-base); position: relative;
    }
    .brief li + li { margin-top: var(--s-sm); }
    .brief li::before {
      content: ''; position: absolute; left: 0; top: 8px;
      width: 5px; height: 5px; border-radius: var(--r-full); background: var(--primary);
    }
    .brief b { color: var(--ink); font-weight: 600; }

    /* ── Zone heading ─────────────────────────────────────── */
    .zone {
      padding-top: var(--s-xl); margin-bottom: var(--s-base);
    }
    .zone h2 {
      font-size: 22px; font-weight: 500; line-height: 1.18;
      letter-spacing: -0.44px; color: var(--ink);
    }
    .zone p {
      font-size: 14px; font-weight: 400; line-height: 1.43;
      color: var(--muted); margin-top: var(--s-xs);
    }

    /* ── Stop card ────────────────────────────────────────── */
    .stop {
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      background: var(--canvas);
      padding: var(--s-lg);
      margin-bottom: var(--s-base);
      transition: box-shadow .2s ease;
    }
    .stop:hover { box-shadow: var(--shadow); }

    .stop-top { display: flex; align-items: flex-start; gap: var(--s-md); }
    .num {
      flex: 0 0 auto; width: 32px; height: 32px; border-radius: var(--r-full);
      background: var(--surface-strong); color: var(--ink);
      font-size: 12px; font-weight: 700; line-height: 32px; text-align: center;
    }
    .stop.key .num { background: var(--primary); color: var(--on-primary); }

    .when {
      font-size: 12px; font-weight: 700; line-height: 1.33;
      color: var(--primary);
    }
    .stop h3 {
      font-size: 20px; font-weight: 600; line-height: 1.2;
      letter-spacing: -0.18px; color: var(--ink); margin-top: var(--s-xxs);
    }
    .why {
      display: inline-block; margin-top: var(--s-sm);
      border: 1px solid var(--hairline); border-radius: var(--r-full);
      padding: 4px 10px;
      font-size: 11px; font-weight: 600; line-height: 1.18; color: var(--ink);
    }
    .desc {
      font-size: 14px; font-weight: 400; line-height: 1.43;
      color: var(--body); margin-top: var(--s-md);
    }
    .desc b { color: var(--ink); font-weight: 600; }
    .desc a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .desc a:active { color: var(--primary-active); }

    /* ── Korean address ───────────────────────────────────── */
    .kaddr {
      margin-top: var(--s-base);
      background: var(--surface-soft);
      border-radius: var(--r-sm);
      padding: var(--s-md) var(--s-base);
    }
    .kaddr .k {
      font-size: 8px; font-weight: 700; line-height: 1.25; letter-spacing: 0.32px;
      text-transform: uppercase; color: var(--muted-soft);
    }
    .kaddr .v {
      font-size: 16px; font-weight: 500; line-height: 1.25;
      color: var(--ink); margin-top: var(--s-xs); word-break: keep-all;
    }
    .copy {
      margin-top: var(--s-sm);
      background: var(--canvas); color: var(--ink);
      border: 1px solid var(--border-strong); border-radius: var(--r-full);
      font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 6px 14px; cursor: pointer;
    }
    .copy:active { background: var(--surface-strong); }

    /* ── Buttons ──────────────────────────────────────────── */
    .actions { display: flex; flex-wrap: wrap; gap: var(--s-sm); margin-top: var(--s-base); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      text-decoration: none; font-size: 14px; font-weight: 500; line-height: 1.29;
      border-radius: var(--r-full); padding: 10px 20px; border: 1px solid transparent;
    }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-primary:active { background: var(--primary-active); }
    .btn-secondary { background: var(--canvas); color: var(--ink); border-color: var(--border-strong); }
    .btn-secondary:active { background: var(--surface-strong); }

    /* ── Transfer row ─────────────────────────────────────── */
    .move {
      display: flex; align-items: flex-start; gap: var(--s-md);
      padding: var(--s-base) var(--s-lg);
      margin-bottom: var(--s-base);
      border-left: 2px dashed var(--hairline);
    }
    .move .when { color: var(--muted-soft); }
    .move h3 { font-size: 16px; font-weight: 600; line-height: 1.25; letter-spacing: 0; }
    .move .desc { font-size: 14px; color: var(--muted); margin-top: var(--s-xs); }

    /* ── Footer ───────────────────────────────────────────── */
    .foot { border-top: 1px solid var(--hairline); margin-top: var(--s-xl); padding-top: var(--s-lg); }
    .foot h2 { font-size: 16px; font-weight: 600; line-height: 1.25; color: var(--ink); margin-bottom: var(--s-md); }
    .foot ul { list-style: none; }
    .foot li {
      font-size: 14px; line-height: 1.43; color: var(--body);
      padding-left: var(--s-base); position: relative;
    }
    .foot li + li { margin-top: var(--s-sm); }
    .foot li::before {
      content: ''; position: absolute; left: 0; top: 8px;
      width: 5px; height: 5px; border-radius: var(--r-full); background: var(--hairline);
    }
    .foot b { color: var(--ink); font-weight: 600; }

    .cta {
      display: block; text-align: center; text-decoration: none;
      background: var(--primary); color: var(--on-primary);
      border-radius: var(--r-sm); padding: 14px 24px; min-height: 48px;
      font-size: 16px; font-weight: 500; line-height: 1.25;
      margin-top: var(--s-lg);
    }
    .cta:active { background: var(--primary-active); }
    .cta.ghost {
      background: var(--canvas); color: var(--ink);
      border: 1px solid var(--ink); margin-top: var(--s-md);
    }
    .cta.ghost:active { background: var(--surface-strong); }

    /* ── Print ────────────────────────────────────────────── */
    @media print {
      .cta.ghost, .copy { display: none; }
      .stop { break-inside: avoid; box-shadow: none; }
      .num, .eyebrow, .btn-primary, .cta { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .btn::after { content: ' (' attr(href) ')'; font-weight: 400; font-size: 10px; word-break: break-all; }
    }

    @media (max-width: 480px) {
      .wrap { padding: 0 var(--s-base) var(--s-xl); }
      h1 { font-size: 24px; }
      .zone h2 { font-size: 20px; }
      .stop { padding: var(--s-base); }
      .fact { flex: 1 1 100%; }
      .fact + .fact { border-left: 0; border-top: 1px solid var(--hairline-soft); padding-left: 0; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <span class="eyebrow">Viernes 2 de octubre · por vuestra cuenta</span>
    <h1>Primer día en Seúl</h1>
    <p class="sub">DDP · Myeongdong · Hongdae</p>
    <p class="brand">Corea octubre · Corea en Español · Gyudong</p>
  </header>

  <div class="facts"><div class="fact"><div class="k">Alojamiento</div><div class="v">Yulgok-ro 179 · Jongno</div></div><div class="fact"><div class="k">Personas</div><div class="v">7</div></div></div>
    <div id="body"></div>

  <footer class="foot">
    
    <a class="cta ghost" href="#" onclick="window.print();return false;">Guardar como PDF</a>
  </footer>

</div>

<script>
/* ── Datos del día. Para editar el itinerario, cambia solo este array. ────────
   px/py y sid vienen del mapa guardado de Naver (no inventar sid).
   kind: 'stop' (parada) | 'move' (traslado)
   mode: 'walk' | 'transit'  → modo del enlace "Cómo llegar" desde la parada anterior
   noRoute: true → esta parada no genera enlace de ruta (ya lo lleva el traslado previo)
   from: {px,py,name,sid} → punto de partida del enlace "Cómo llegar" (p. ej. el hotel al empezar el día)
*/
var STOPS = [
  { zone: "Llegada" },
  {
    kind: "stop",
    key: true,
    time: "16:00",
    title: "Alojamiento (Mayplace Hotel)",
    kaddr: "서울 종로구 율곡로 179",
    sid: "34353161",
    name: "메이플레이스",
    px: 126.998699,
    py: 37.57609,
    noRoute: true,
  },
  { zone: "Si vais a Gyeongbokgung", zoneNote: "Solo si llegáis pronto · el palacio cierra a las 18:00" },
  {
    kind: "stop",
    time: "opción",
    title: "Hanbok · Daehan Hanbok (대한한복)",
    desc: "2º piso · primero elegís la falda (치마) y os ayudan a elegir la parte de arriba (저고리) · hay normal y premium · el peinado (casi todas las chicas) se hace en el 3º piso",
    kaddr: "서울 종로구 사직로 133-2 2층",
    sid: "1086043487",
    name: "대한한복",
    px: 126.973534,
    py: 37.576123,
    mode: "transit",
    from: {"px": 126.998699, "py": 37.57609, "name": "메이플레이스", "sid": "34353161"},
  },
  {
    kind: "stop",
    time: "opción",
    title: "Palacio Gyeongbokgung (경복궁)",
    desc: "Entrada 3,000 KRW · gratis con hanbok",
    kaddr: "서울 종로구 사직로 161",
    sid: "11571707",
    name: "경복궁",
    px: 126.977016,
    py: 37.578841,
    mode: "walk",
  },
  { zone: "Tarde y noche" },
  {
    kind: "stop",
    time: "18:00",
    title: "DDP (동대문디자인플라자)",
    kaddr: "서울 중구 을지로 281",
    sid: "18063223",
    name: "동대문디자인플라자",
    px: 127.009932,
    py: 37.567546,
    mode: "transit",
    from: {"px": 126.998699, "py": 37.57609, "name": "메이플레이스", "sid": "34353161"},
  },
  {
    kind: "stop",
    key: true,
    time: "19:00",
    title: "Myeongdong · brochetas de pollo (닭꼬치)",
    desc: "Delante del Adidas más grande de Myeongdong hay un puesto de brochetas de pollo",
    kaddr: "서울 중구 명동8길 27",
    sid: "1170346196",
    name: "아디다스 브랜드 플래그십 서울",
    px: 126.984899,
    py: 37.562654,
    mode: "transit",
  },
  {
    kind: "stop",
    time: "20:00",
    title: "Postre · Sulbing (설빙 명동점)",
    desc: "El de mango está buenísimo · es un postre tradicional coreano (bingsu) que se ha modernizado con fruta",
    kaddr: "서울 중구 명동3길 27 2, 3층",
    sid: "1621273819",
    name: "설빙 명동점",
    px: 126.98348,
    py: 37.564885,
    mode: "walk",
  },
  {
    kind: "stop",
    key: true,
    time: "22:00",
    title: "Hongdae · Club Awesome Red (어썸)",
    desc: "Fiesta · es grande, así que huele poco a tabaco · en la calle principal de clubs · abre a las 21:00",
    kaddr: "서울 마포구 잔다리로 12 지하1층",
    search: "홍대 어썸레드 클럽",
    name: "어썸 레드",
    mode: "transit",
  },
  {
    kind: "stop",
    time: "o",
    title: "La Bamba (라밤바)",
    desc: "Detrás de la calle de clubs · otra opción",
    kaddr: "서울 마포구 와우산로19길 5 1층",
    sid: "1574894900",
    name: "라밤바",
    px: 126.922916,
    py: 37.551136,
    mode: "walk",
    from: {"px": 126.923043, "py": 37.550727, "name": "홍대클럽거리", "sid": "13544521"},
  },
  { zone: "Volver" },
  {
    kind: "stop",
    time: "→",
    title: "Alojamiento (Mayplace Hotel)",
    kaddr: "서울 종로구 율곡로 179",
    sid: "34353161",
    name: "메이플레이스",
    px: 126.998699,
    py: 37.57609,
    mode: "transit",
    from: {"px": 126.922916, "py": 37.551136, "name": "라밤바", "sid": "1574894900"},
  },
];

/* ── Render ──────────────────────────────────────────────────────────────── */
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function e(s) { return encodeURIComponent(s == null ? '' : s); }

/* Naver: /p/directions/{lng},{lat},{nombre},{sid},PLACE_POI/{destino}/-/{modo} */
function poi(s) {
  if (!s) return null;
  return s.px + ',' + s.py + ',' + e(s.name) + ',' + (s.sid || '') + ',' + (s.sid ? 'PLACE_POI' : '');
}
function routeUrl(from, to, mode) {
  var a = poi(from), b = poi(to);
  if (!a || !b) return null;
  return 'https://map.naver.com/p/directions/' + a + '/' + b + '/-/' + (mode || 'transit');
}
function placeUrl(s) {
  if (s.sid) return 'https://map.naver.com/p/entry/place/' + s.sid;
  if (s.search) return 'https://map.naver.com/p/search/' + e(s.search);
  return null;
}

(function render() {
  var out = '', prev = null, num = 0, k = 0;

  STOPS.forEach(function (s) {
    if (s.zone) {
      out += '<div class="zone"><h2>' + esc(s.zone) + '</h2>' +
             (s.zoneNote ? '<p>' + esc(s.zoneNote) + '</p>' : '') + '</div>';
      return;
    }

    var isMove = s.kind === 'move';
    if (!isMove) num++;

    var actions = '';
    var pu = placeUrl(s);
    if (pu) actions += '<a class="btn btn-primary" target="_blank" rel="noopener" href="' + pu + '">Ver en Naver Map</a>';
    /* from: 출발점 덮어쓰기 — 여러 날 일정에서 그날 첫 장소는 어제 마지막이 아니라 호텔에서 출발한다 */
    var ru = s.noRoute ? null : routeUrl(s.from || prev, s, s.mode);
    if (ru) {
      var label = s.mode === 'walk' ? 'Cómo llegar a pie' : 'Cómo llegar';
      actions += '<a class="btn btn-secondary" target="_blank" rel="noopener" href="' + ru + '">' + label + '</a>';
    }

    var addr = '';
    if (s.kaddr) {
      k++;
      addr = '<div class="kaddr">' +
               '<div class="k">Muéstralo al taxista</div>' +
               '<div class="v" id="k' + k + '">' + esc(s.kaddr) + '</div>' +
               '<button class="copy" onclick="copyK(\'k' + k + '\', this)">Copiar</button>' +
             '</div>';
    }

    var inner = '<div class="when">' + esc(s.time) + '</div>' +
                '<h3>' + esc(s.title) + '</h3>' +
                (s.why ? '<div><span class="why">' + esc(s.why) + '</span></div>' : '') +
                '<div class="desc">' + (s.desc || '') + '</div>' +
                addr +
                (actions ? '<div class="actions">' + actions + '</div>' : '');

    if (isMove) {
      out += '<div class="move"><div>' + inner + '</div></div>';
    } else {
      out += '<div class="stop' + (s.key ? ' key' : '') + '">' +
               '<div class="stop-top">' +
                 '<div class="num">' + num + '</div>' +
                 '<div style="flex:1;min-width:0">' + inner + '</div>' +
               '</div>' +
             '</div>';
    }

    prev = s;
  });

  document.getElementById('body').innerHTML = out;
})();

function copyK(id, btn) {
  var t = document.getElementById(id).textContent;
  var done = function () {
    var old = btn.textContent;
    btn.textContent = 'Copiado';
    setTimeout(function () { btn.textContent = old; }, 1500);
  };
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (err) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, fallback);
  } else { fallback(); }
}
</script>

</body>
</html>
