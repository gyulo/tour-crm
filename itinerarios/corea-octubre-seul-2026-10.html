      --muted: #6a6a6a;
      --muted-soft: #929292;
      --hairline: #dddddd;
      --hairline-soft: #ebebeb;
      --border-strong: #c1c1c1;

    }

    body {
      font-family: var(--font);
      background: var(--canvas);
      color: var(--body);

    }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--s-lg) var(--s-xxl); }

    /* ── Hero ─────────────────────────────────────────────── */
    .hero { padding: var(--s-xl) 0 var(--s-lg); }
    .eyebrow {

      font-size: 11px; font-weight: 600; line-height: 1.18;
      color: var(--on-primary); background: var(--primary);
      border-radius: var(--r-full); padding: 5px 12px;
      margin-bottom: var(--s-base);
    }
    h1 {
      font-size: 28px; font-weight: 700; line-height: 1.2;
      letter-spacing: -0.5px; color: var(--ink);
    }
    .hero .sub {
      font-size: 16px; font-weight: 400; line-height: 1.5;
      color: var(--muted); margin-top: var(--s-sm);
    }
    .hero .brand {

      color: var(--muted-soft); margin-top: var(--s-md);
    }

      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
      margin-bottom: var(--s-lg);

    .fact { flex: 1 1 33%; padding: var(--s-base) 0; }
    .fact + .fact { border-left: 1px solid var(--hairline-soft); padding-left: var(--s-base); }
    .fact .k {

      text-transform: uppercase; color: var(--muted-soft);
    }
    .fact .v {
      font-size: 16px; font-weight: 600; line-height: 1.25;
      color: var(--ink); margin-top: var(--s-xs);
    }

      background: var(--surface-soft);
      border-radius: var(--r-md);
      padding: var(--s-lg);
      margin-bottom: var(--s-xl);
    }
    .brief h2 { font-size: 16px; font-weight: 600; line-height: 1.25; color: var(--ink); margin-bottom: var(--s-md); }
    .brief ul { list-style: none; }
    .brief li {
      font-size: 14px; line-height: 1.43; color: var(--body);
      padding-left: var(--s-base); position: relative;
    }
    .brief li + li { margin-top: var(--s-sm); }

      content: ''; position: absolute; left: 0; top: 8px;
      width: 5px; height: 5px; border-radius: var(--r-full); background: var(--primary);

    .brief b { color: var(--ink); font-weight: 600; }

      letter-spacing: -0.44px; color: var(--ink);
    }
    .zone p {

      color: var(--muted); margin-top: var(--s-xs);

      border-radius: var(--r-md);

      padding: var(--s-lg);
      margin-bottom: var(--s-base);
      transition: box-shadow .2s ease;

      background: var(--surface-strong); color: var(--ink);
      font-size: 12px; font-weight: 700; line-height: 32px; text-align: center;
    }
    .stop.key .num { background: var(--primary); color: var(--on-primary); }

    .when {
      font-size: 12px; font-weight: 700; line-height: 1.33;
      color: var(--primary);
    }
    .stop h3 {

    .why {

    .desc a:active { color: var(--primary-active); }

    .kaddr {

      background: var(--surface-soft);
      border-radius: var(--r-sm);
      padding: var(--s-md) var(--s-base);

      font-size: 16px; font-weight: 500; line-height: 1.25;

    .copy {

    .btn-secondary { background: var(--canvas); color: var(--ink); border-color: var(--border-strong); }

      width: 5px; height: 5px; border-radius: var(--r-full); background: var(--hairline);

      font-size: 16px; font-weight: 500; line-height: 1.25;
      margin-top: var(--s-lg);

    .cta:active { background: var(--primary-active); }
    .cta.ghost {

    .cta.ghost:active { background: var(--surface-strong); }

      .num, .eyebrow, .btn-primary, .cta { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .btn::after { content: ' (' attr(href) ')'; font-weight: 400; font-size: 10px; word-break: break-all; }
    }

    @media (max-width: 480px) {
      .wrap { padding: 0 var(--s-base) var(--s-xl); }
      h1 { font-size: 24px; }
      .zone h2 { font-size: 20px; }
      .stop { padding: var(--s-base); }
      .fact { flex: 1 1 100%; }
      .fact + .fact { border-left: 0; border-top: 1px solid var(--hairline-soft); padding-left: 0; }
    }
  </style>
</head>

/* ── Render ──────────────────────────────────────────────────────────────── */
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function e(s) { return encodeURIComponent(s == null ? '' : s); }

/* Naver: /p/directions/{lng},{lat},{nombre},{sid},PLACE_POI/{destino}/-/{modo} */
function poi(s) {
  if (!s) return null;
  return s.px + ',' + s.py + ',' + e(s.name) + ',' + (s.sid || '') + ',' + (s.sid ? 'PLACE_POI' : '');
}
function routeUrl(from, to, mode) {
  var a = poi(from), b = poi(to);
  if (!a || !b) return null;
  return 'https://map.naver.com/p/directions/' + a + '/' + b + '/-/' + (mode || 'transit');
}
function placeUrl(s) {
  if (s.sid) return 'https://map.naver.com/p/entry/place/' + s.sid;
  if (s.search) return 'https://map.naver.com/p/search/' + e(s.search);
  return null;
}

(function render() {
  var out = '', prev = null, num = 0, k = 0;

  STOPS.forEach(function (s) {
    if (s.zone) {
      out += '<div class="zone"><h2>' + esc(s.zone) + '</h2>' +
             (s.zoneNote ? '<p>' + esc(s.zoneNote) + '</p>' : '') + '</div>';
      return;
    }

    var isMove = s.kind === 'move';
    if (!isMove) num++;

    var actions = '';
    var pu = placeUrl(s);
    if (pu) actions += '<a class="btn btn-primary" target="_blank" rel="noopener" href="' + pu + '">Ver en Naver Map</a>';
    /* from: 출발점 덮어쓰기 — 여러 날 일정에서 그날 첫 장소는 어제 마지막이 아니라 호텔에서 출발한다 */
    var ru = s.noRoute ? null : routeUrl(s.from || prev, s, s.mode);
    if (ru) {
      var label = s.mode === 'walk' ? 'Cómo llegar a pie' : 'Cómo llegar';
      actions += '<a class="btn btn-secondary" target="_blank" rel="noopener" href="' + ru + '">' + label + '</a>';
    }

    var addr = '';
    if (s.kaddr) {
      k++;
      addr = '<div class="kaddr">' +
               '<div class="k">Muéstralo al taxista</div>' +
               '<div class="v" id="k' + k + '">' + esc(s.kaddr) + '</div>' +
               '<button class="copy" onclick="copyK(\'k' + k + '\', this)">Copiar</button>' +
             '</div>';
    }

    var inner = '<div class="when">' + esc(s.time) + '</div>' +
                '<h3>' + esc(s.title) + '</h3>' +
                (s.why ? '<div><span class="why">' + esc(s.why) + '</span></div>' : '') +
                '<div class="desc">' + (s.desc || '') + '</div>' +
                addr +
                (actions ? '<div class="actions">' + actions + '</div>' : '');

    if (isMove) {
      out += '<div class="move"><div>' + inner + '</div></div>';
    } else {
      out += '<div class="stop' + (s.key ? ' key' : '') + '">' +
               '<div class="stop-top">' +
                 '<div class="num">' + num + '</div>' +
                 '<div style="flex:1;min-width:0">' + inner + '</div>' +
               '</div>' +
             '</div>';
    }

    prev = s;
  });

  document.getElementById('body').innerHTML = out;
})();

function copyK(id, btn) {
  var t = document.getElementById(id).textContent;
  var done = function () {
    var old = btn.textContent;
    btn.textContent = 'Copiado';
    setTimeout(function () { btn.textContent = old; }, 1500);
  };
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (err) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, fallback);
  } else { fallback(); }
}
