<!DOCTYPE html>
<!--
  itinerary-es.html — Itinerario personalizado en español
  Se llena con parámetros URL: ?name=&date=&hours=&cities=&meet=&notes=
  NO incluir información sensible (precio, teléfono) en la URL.
  Mobile + print friendly. Botón "Guardar PDF".
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Itinerario — Corea en Español</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #F97316;
      --teal: #0D9488;
      --teal-dark: #0F766E;
      --cream: #FFF7ED;
      --text: #1a1a1a;
      --text-light: #6B7280;
      --white: #FFFFFF;
      --border: #E5E7EB;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--cream);
      line-height: 1.6;
      padding: 20px;
    }
    .page {
      max-width: 700px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
      color: var(--white);
      padding: 32px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }
    .header .subtitle {
      font-size: 1rem;
      opacity: 0.9;
    }
    .header .brand {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 12px;
    }

    /* Info bar */
    .info-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .info-item {
      background: var(--white);
      padding: 16px 20px;
      text-align: center;
    }
    .info-item .label {
      font-size: 0.75rem;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .info-item .value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--teal-dark);
    }

    /* Content */
    .content {
      padding: 32px;
    }

    /* Notes */
    .notes-box {
      background: #FEF3C7;
      border: 1px solid #FCD34D;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 28px;
      font-size: 0.9rem;
    }
    .notes-box .notes-title {
      font-weight: 600;
      color: #92400E;
      margin-bottom: 4px;
    }
    .notes-box p { color: #78350F; }

    /* Timeline */
    .timeline { position: relative; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }
    .time-block {
      position: relative;
      padding-left: 52px;
      margin-bottom: 24px;
    }
    .time-block:last-child { margin-bottom: 0; }
    .time-dot {
      position: absolute;
      left: 12px;
      top: 4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--teal);
      border: 3px solid var(--white);
      box-shadow: 0 0 0 2px var(--teal);
    }
    .time-block.highlight .time-dot {
      background: var(--orange);
      box-shadow: 0 0 0 2px var(--orange);
    }
    .time-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--teal);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .time-block.highlight .time-label { color: var(--orange); }
    .time-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .time-desc {
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .time-tag {
      display: inline-block;
      background: var(--cream);
      color: var(--teal-dark);
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 50px;
      margin-top: 6px;
      font-weight: 500;
    }

    /* Footer */
    .footer-section {
      background: var(--cream);
      padding: 24px 32px;
      border-top: 1px solid var(--border);
    }
    .footer-section h3 {
      font-size: 0.95rem;
      color: var(--teal-dark);
      margin-bottom: 12px;
    }
    .footer-section ul {
      list-style: none;
      font-size: 0.85rem;
      color: var(--text-light);
    }
    .footer-section li {
      margin-bottom: 6px;
      padding-left: 20px;
      position: relative;
    }
    .footer-section li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: var(--teal);
      font-weight: 700;
    }

    /* PDF button */
    .pdf-btn-wrap {
      text-align: center;
      padding: 24px;
    }
    .pdf-btn {
      display: inline-block;
      padding: 12px 32px;
      background: var(--orange);
      color: var(--white);
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      font-family: inherit;
    }
    .pdf-btn:hover { background: #EA580C; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-state h2 { margin-bottom: 8px; color: var(--text); }

    /* Print styles */
    @media print {
      body { background: white; padding: 0; }
      .page { box-shadow: none; border-radius: 0; }
      .pdf-btn-wrap { display: none; }
      .time-dot { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .header { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }

    @media (max-width: 480px) {
      .header { padding: 24px 16px; }
      .content { padding: 24px 16px; }
      .header h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="page" id="itinerary">
    <!-- Filled by JavaScript from URL params -->
  </div>

  <div class="pdf-btn-wrap" id="pdfBtnWrap">
    <button class="pdf-btn" onclick="window.print()">Guardar como PDF</button>
  </div>

  <script>
    /**
     * Parse URL query parameters
     */
    function getParams() {
      var params = {};
      var search = window.location.search.substring(1);
      if (!search) return params;
      search.split('&').forEach(function(pair) {
        var parts = pair.split('=');
        params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
      });
      return params;
    }

    /**
     * Default itinerary templates per city
     * These are sample blocks — in production, CRM would pass specific activities
     */
    var CITY_ITINERARIES = {
      'seoul': {
        label: 'Seúl',
        blocks: [
          { time: 'Mañana',    title: 'Palacio Gyeongbokgung y Gwanghwamun',    desc: 'Ceremonia del cambio de guardia. Opción de vestir hanbok para fotos.', tag: 'Cultura' },
          { time: 'Media mañana', title: 'Bukchon Hanok Village',               desc: 'Paseo por las callejuelas tradicionales con casas hanok centenarias.', tag: 'Tradición' },
          { time: 'Almuerzo',  title: 'Insadong — Comida tradicional',          desc: 'Restaurante local recomendado. Bibimbap, japchae o samgyetang.', tag: 'Gastronomía', highlight: true },
          { time: 'Tarde',     title: 'Seúl Moderno',                            desc: 'Gentle Monster, Biblioteca Starfield o Lago Seokchon según preferencia.', tag: 'Moderno' },
          { time: 'Atardecer', title: 'Mercado Gwangjang',                       desc: 'Street food auténtico: tteokbokki, bindaetteok, mayak kimbap.', tag: 'Gastronomía', highlight: true },
          { time: 'Noche',     title: 'Río Han — Picnic nocturno',              desc: 'Chicken + cerveza coreana frente al río. La experiencia más local.', tag: 'Experiencia' }
        ]
      },
      'busan': {
        label: 'Busán',
        blocks: [
          { time: 'Mañana',    title: 'Haeundae Beach',                          desc: 'Paseo por la playa más famosa de Corea. Café costero.', tag: 'Naturaleza' },
          { time: 'Media mañana', title: 'Blue Line Park',                       desc: 'Tren costero panorámico con vistas al mar.', tag: 'Experiencia', highlight: true },
          { time: 'Almuerzo',  title: 'Mariscos frescos en el mercado',          desc: 'Mercado Jagalchi o restaurante local de mariscos.', tag: 'Gastronomía', highlight: true },
          { time: 'Tarde',     title: 'Gamcheon Culture Village',                desc: 'El "Machu Picchu de Busán". Arte callejero y cafés escondidos.', tag: 'Cultura' },
          { time: 'Atardecer', title: 'Spa Land (Centum City)',                  desc: 'Jjimjilbang premium con aguas termales y saunas temáticas.', tag: 'Relax' },
          { time: 'Noche',     title: 'Puente Gwangalli y cena',                desc: 'Vista nocturna del puente iluminado. Cena coreana con vista al mar.', tag: 'Experiencia' }
        ]
      }
    };

    /**
     * Build the itinerary HTML
     */
    function render() {
      var p = getParams();
      var container = document.getElementById('itinerary');

      // Check if we have minimum data
      if (!p.name && !p.cities) {
        container.innerHTML = '<div class="empty-state">' +
          '<h2>Itinerario no disponible</h2>' +
          '<p>Este enlace necesita parámetros para mostrar tu itinerario personalizado.</p>' +
          '<p style="margin-top:12px;font-size:0.85rem;">Parámetros: ?name=&date=&hours=&cities=&meet=&notes=</p>' +
          '</div>';
        document.getElementById('pdfBtnWrap').style.display = 'none';
        return;
      }

      var name = p.name || 'Viajero';
      var date = p.date || 'Por confirmar';
      var hours = p.hours || '8';
      var cities = (p.cities || 'seoul').toLowerCase().split(',');
      var meet = p.meet || 'Por confirmar';
      var notes = p.notes || '';

      // Header
      var html = '<div class="header">' +
        '<h1>Itinerario de ' + escapeHtml(name) + '</h1>' +
        '<div class="subtitle">Tour privado en español — Corea del Sur</div>' +
        '<div class="brand">Corea en Español</div>' +
        '</div>';

      // Info bar
      html += '<div class="info-bar">' +
        '<div class="info-item"><div class="label">Fecha</div><div class="value">' + escapeHtml(date) + '</div></div>' +
        '<div class="info-item"><div class="label">Duración</div><div class="value">' + escapeHtml(hours) + ' horas</div></div>' +
        '<div class="info-item"><div class="label">Punto de encuentro</div><div class="value">' + escapeHtml(meet) + '</div></div>' +
        '</div>';

      html += '<div class="content">';

      // Notes
      if (notes) {
        html += '<div class="notes-box">' +
          '<div class="notes-title">📝 Notas especiales</div>' +
          '<p>' + escapeHtml(notes) + '</p>' +
          '</div>';
      }

      // Timeline per city
      cities.forEach(function(city) {
        city = city.trim();
        var cityData = CITY_ITINERARIES[city];
        if (!cityData) return;

        if (cities.length > 1) {
          html += '<h2 style="font-size:1.2rem;color:#0F766E;margin-bottom:16px;margin-top:8px;">📍 ' + cityData.label + '</h2>';
        }

        html += '<div class="timeline">';
        cityData.blocks.forEach(function(block) {
          // Adjust blocks based on hours (6h = skip last 2 blocks)
          var maxBlocks = parseInt(hours) >= 8 ? 6 : 4;

          html += '<div class="time-block' + (block.highlight ? ' highlight' : '') + '">' +
            '<div class="time-dot"></div>' +
            '<div class="time-label">' + escapeHtml(block.time) + '</div>' +
            '<div class="time-title">' + escapeHtml(block.title) + '</div>' +
            '<div class="time-desc">' + escapeHtml(block.desc) + '</div>' +
            '<span class="time-tag">' + escapeHtml(block.tag) + '</span>' +
            '</div>';
        });
        html += '</div>';
      });

      html += '</div>'; // .content

      // Footer section
      html += '<div class="footer-section">' +
        '<h3>Información importante</h3>' +
        '<ul>' +
        '<li>El itinerario puede ajustarse según el ritmo del día</li>' +
        '<li>Incluye guía y traducción en español durante todo el tour</li>' +
        '<li>Transporte y entradas se pagan aparte (te indico los precios)</li>' +
        '<li>Adaptamos la comida a cualquier restricción alimentaria</li>' +
        '<li>En caso de lluvia, tenemos plan B preparado</li>' +
        '</ul>' +
        '</div>';

      container.innerHTML = html;
      document.title = 'Itinerario de ' + name + ' — Corea en Español';
    }

    function escapeHtml(str) {
      if (!str) return '';
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    render();
  </script>

</body>
</html>
