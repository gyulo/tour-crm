<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>답장 대기</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d1b18;--sub:#6f6a62;--line:#e4dfd4;--me:#dcf8c6;--you:#fff;--chat:#ece5dd;--go:#1f9d55;--go2:#17804a;--warn:#b7791f;--bad:#c53030;--chip:#f0ebe0}
@media (prefers-color-scheme:dark){:root{--bg:#141311;--card:#1f1d1a;--ink:#f1ede6;--sub:#a29c92;--line:#35322c;--me:#1f4a33;--you:#2a2824;--chat:#191714;--chip:#2a2824}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 6px}
.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sync{font-size:12px;color:var(--sub);margin-top:4px}
#bar{margin:14px 0 6px}
#bar .row{display:flex;align-items:center;gap:10px}
#bar .track{flex:1;height:18px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
#bar .fill{height:100%;border-radius:99px;background:#58cc02;position:relative;transition:width .7s cubic-bezier(.3,1.4,.5,1);min-width:18px}
#bar .fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:99px;background:rgba(255,255,255,.35)}
#bar .num{font-weight:800;font-size:15px;color:#58a700;min-width:52px;text-align:right}
#bar .txt{font-size:12px;margin-top:6px;color:var(--sub)}
.memo{margin-top:10px}
.memo textarea{width:100%;min-height:54px;font:inherit;font-size:14px;padding:8px 10px;border:1px dashed #c9a227;border-radius:10px;background:#fffbea;color:#3d3200;resize:vertical}
@media (prefers-color-scheme:dark){.memo textarea{background:#2b2612;color:#f3e7b5}}
.memo button{margin-top:6px;border:0;border-radius:10px;padding:9px 12px;background:#e0b341;color:#3d2a00;font-weight:700;cursor:pointer;width:100%}
.memonote{font-size:13px;background:#fff3c4;color:#5a4500;border-radius:8px;padding:7px 10px;margin:8px 0}
@media (prefers-color-scheme:dark){.memonote{background:#3a3214;color:#f3e7b5}}
.redo{font-size:13px;color:var(--sub);margin:-4px 0 10px;text-align:center}
#toast{white-space:nowrap;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:20;
 background:#58cc02;color:#fff;font-weight:800;font-size:24px;padding:22px 30px;border-radius:20px;box-shadow:0 6px 0 #58a700;text-align:center;transition:all .35s cubic-bezier(.3,1.6,.5,1)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;font-size:14px;font-weight:600;margin-top:6px;opacity:.9}
header{padding-top:18px!important}
.nav{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;font-size:13px;color:var(--sub)}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.nav button:disabled{opacity:.35}
main{max-width:640px;margin:0 auto;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700;font-size:16px}
.money{font-size:13px;font-weight:600;margin:2px 0 8px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);white-space:nowrap}
.pill.approved,.pill.sending{background:#fde9b8;color:#7a4d00}.pill.sent{background:#cdeed9;color:#145c34}.pill.failed{background:#fbd5d5;color:#8a1f1f}
details{margin:6px 0}
summary{cursor:pointer;font-size:13px;color:var(--sub)}
.chat{background:var(--chat);border-radius:10px;padding:8px;margin-top:6px;max-height:340px;overflow:auto}
.b{max-width:85%;padding:5px 9px;border-radius:8px;margin:3px 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.b.me{background:var(--me);margin-left:auto}.b.you{background:var(--you)}
.b small{display:block;font-size:10px;color:var(--sub)}
.box{border-radius:10px;padding:9px 11px;margin:8px 0;font-size:14px}
.box h4{margin:0 0 4px;font-size:12px;color:var(--sub);font-weight:700}
.sum{background:#e8f0fe;color:#1a2b4a}.why{background:var(--chip);font-size:13px}
@media (prefers-color-scheme:dark){.sum{background:#1f2a3d;color:#dbe6ff}}
.vt{display:block;margin-top:4px;padding-top:4px;border-top:1px dashed rgba(0,0,0,.15);font-style:italic}
.sec{font-size:12px;color:var(--sub);font-weight:700;margin:10px 0 0}
.lines{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ln{display:flex;gap:6px;align-items:center}
.ln input{flex:1;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:18px;background:var(--me);color:var(--ink)}
.ln button{border:0;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:0 4px}
.add{align-self:flex-start;border:1px dashed var(--line);background:none;color:var(--sub);border-radius:18px;padding:5px 12px;cursor:pointer;font-size:13px}
.score{font-size:12px;color:var(--sub);margin-top:6px}
.acts{display:flex;gap:8px;margin-top:12px}
.go{flex:1;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:700;background:var(--go);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--go2)}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--go2)}
.skip{border:1px solid var(--line);background:none;color:var(--sub);border-radius:12px;padding:12px 14px;cursor:pointer}
.sentlines{font-size:14px;margin-top:6px}.sentlines div{padding:2px 0}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
</style></head><body>
<header><h1>💬 답장 대기</h1>
<div class="tabs"><button data-t="todo" class="on">보낼 것</button><button data-t="done">보낸 것</button><button data-t="skip">건너뜀</button></div>
<div id="bar"></div><div id="sync">불러오는 중…</div></header>
<main id="list"></main><div id="toast"></div>
<script>
const URL0 = 'https://2boqkaotufrfukcsmkh2zaz6yy0jrwbi.lambda-url.ap-northeast-2.on.aws/';
const KEY = new URLSearchParams(location.search).get('k') || 'reply:gauvtgjusbjpcu';
let S = {updatedAt:0, items:[]}, tab = 'todo', editing = false, cur = 0;
const dirty = {};   // 고친 줄 — 서버 저장이 끝날 때까지 다시 불러와도 덮어쓰지 않는다
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function pull(){
  try{
    const r = await fetch(URL0 + '?key=' + encodeURIComponent(KEY), {cache:'no-store'});
    const s = await r.json();
    if (s) { S = s; for (const it of S.items||[]) if (dirty[it.id] && it.status==='draft') it.lines = dirty[it.id]; }
    $('#sync').textContent = '방금 불러옴 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    if (!editing) render();
  }catch(e){ $('#sync').textContent = '불러오기 실패 — 인터넷 확인'; }
}
async function save(item, redraw=true){
  item.u = Date.now();
  try{
    const r = await fetch(URL0 + '?key=' + encodeURIComponent(KEY), {cache:'no-store'});
    const cur = (await r.json()) || {items:[]};
    const by = Object.fromEntries((cur.items||[]).map(x => [x.id, x]));
    const old = by[item.id];
    if (old && ['sending','sent'].includes(old.status)) { S = cur; render(); alert('이미 보내는 중이거나 보냈어요.'); return; }
    by[item.id] = item;
    cur.items = Object.values(by).sort((a,b) => (a.order||0)-(b.order||0));
    cur.updatedAt = Date.now();
    await fetch(URL0, {method:'POST', headers:{'content-type':'text/plain'}, body: JSON.stringify({key:KEY, state:cur})});
    delete dirty[item.id];
    S = cur; if (redraw && !editing) render();
  }catch(e){ alert('저장 실패 — 다시 눌러 주세요'); }
}
function score(lines){
  const L = lines.map(x=>x.trim()).filter(Boolean); if(!L.length) return '';
  const ln = L.map(x=>x.length).sort((a,b)=>a-b), med = ln[Math.floor(ln.length/2)];
  const short = Math.round(100*ln.filter(x=>x<=10).length/ln.length);
  const acc = /[áéíóúÁÉÍÓÚ]/.test(L.join('')), inv = /[¿¡]/.test(L.join(''));
  const f = ok => ok ? '✅' : '⚠️';
  return `말투: 중앙값 ${med}자 ${f(med>=8&&med<=20)} · 10자 이하 ${short}% ${f(short>=30)} · 악센트 ${f(!acc)} · ¿¡ ${f(!inv)}`;
}
function card(it){
  const st = it.status;
  const label = {draft:'초안', approved:'보내기 대기 (1분 안에 나감)', sending:'보내는 중', sent:'보냄', failed:'실패', skip:'건너뜀'}[st] || st;
  const hist = (it.hist||[]).map(m => `<div class="b ${m.me?'me':'you'}"><small>${esc(m.w)} ${m.me?'나':'손님'}</small>${esc(m.t)}${m.voice?`<span class="vt">✍️ ${esc(m.voice)}</span>`:''}</div>`).join('');
  let body = '';
  if (st === 'draft'){
    body = `<div class="sec">② 보낼 문자</div><div class="lines">${it.lines.map((l,i)=>`<div class="ln"><input value="${esc(l)}" data-i="${i}"><button data-del="${i}" title="이 줄 빼기">✕</button></div>`).join('')}
      <button class="add">＋ 줄 추가</button></div>
      <div class="score">${score(it.lines)}</div>
      ${it.why ? `<div class="box why"><h4>③ 이렇게 보내는 이유</h4>${it.why}</div>` : ''}
      <div class="acts"><button class="go">보내기</button><button class="skip">건너뛰기</button></div>
      <div class="memo"><textarea placeholder="바로 못 보내겠으면 여기 메모 → 클로드가 다시 써 둬요 (예: 가격 250 넣고 날짜 물어봐)"></textarea><button class="memogo">메모 남기고 다음 ▶</button></div>`;
  } else {
    body = `<div class="sentlines">${it.lines.map(l=>`<div>• ${esc(l)}</div>`).join('')}</div>` +
      (it.err ? `<div class="err">${esc(it.err)}</div>` : '') +
      (st==='approved' ? `<div class="acts"><button class="skip undo">취소 (아직 안 나갔으면)</button></div>` : '') +
      (st==='skip' ? `<div class="acts"><button class="skip undo">다시 초안으로</button></div>` : '');
  }
  return `<div class="card" data-id="${esc(it.id)}">
    <div class="top"><div><div class="nm">${esc(it.name)}</div></div><span class="pill ${st}">${label}</span></div>
    <div class="money">${esc(it.money||'')}</div>
    <details><summary>대화 원문 ${(it.hist||[]).length}개</summary><div class="chat">${hist}</div></details>
    ${it.memo && st==='draft' ? `<div class="memonote">✏️ 회장님 메모 「${esc(it.memo)}」 → 다시 썼어요</div>` : ''}
    ${st==='memo' ? `<div class="memonote">✏️ 「${esc(it.memo)}」 — 클로드가 다시 쓰는 중</div>` : ''}
    ${it.summary ? `<div class="box sum"><h4>① 손님이 하는 말</h4>${esc(it.summary)}</div>` : ''}
    ${body}</div>`;
}
const todayKey = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
function todays(){ const k = todayKey(); return (S.items||[]).filter(x => new Date((x.created||x.u||0)+9*3600e3).toISOString().slice(0,10) === k); }
let lastPct = null;
function toast(big, small){ const t = $('#toast'); t.innerHTML = big + (small?`<small>${small}</small>`:''); t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 2200); }
function bar(){
  const all = todays();
  const sent = all.filter(x=>x.status==='sent').length, wait = all.filter(x=>['approved','sending'].includes(x.status)).length,
        skip = all.filter(x=>x.status==='skip').length, n = all.length, done = sent+wait+skip;
  if (!n){ $('#bar').innerHTML = ''; return; }
  const pct = Math.round(100*done/n);
  $('#bar').innerHTML = `<div class="row"><div class="track"><div class="fill" style="width:${Math.max(pct,0)}%"></div></div><div class="num">${done}/${n}</div></div>
    <div class="txt">오늘 · 보냄 ${sent} · 나가는 중 ${wait} · 건너뜀 ${skip} · 남음 ${n-done}</div>`;
  // 중간중간 축하 — 처음 불러올 땐 안 띄우고, 내가 눌러서 넘어갈 때만
  if (lastPct !== null && pct > lastPct){
    const k = 'rp_toast_'+todayKey(); let seen = {}; try{ seen = JSON.parse(localStorage.getItem(k)||'{}'); }catch(e){}
    const marks = [[100,'다 했어요!','오늘 답장 끝'],[75,'거의 다 왔어요','조금만 더'],[50,'반 도착했어요!','절반 끝'],[25,'좋아요, 시작!','4분의 1 끝']];
    for (const [m,big,small] of marks){ if (lastPct < m && pct >= m && !seen[m]){ seen[m]=1; try{ localStorage.setItem(k, JSON.stringify(seen)); }catch(e){} toast(big, small); break; } }
  }
  lastPct = pct;
}
function render(){
  bar();
  const n = (S.items||[]).filter(x=>x.status==='draft').length;
  document.title = n ? `(${n}) 답장 대기` : '답장 대기';
  document.querySelector('[data-t=todo]').textContent = '보낼 것' + (n?` ${n}`:'');
  if (tab === 'todo'){
    const pend = (S.items||[]).filter(x => ['draft','failed'].includes(x.status)).sort((a,b)=>(a.redoneAt||0)-(b.redoneAt||0));
    const nm = (S.items||[]).filter(x=>x.status==='memo').length;
    const redo = nm ? `<div class="redo">✏️ 클로드가 다시 쓰는 중 ${nm}장 — 끝나면 여기 뒤에 붙어요</div>` : '';
    if (!pend.length){ $('#list').innerHTML = redo + `<div class="empty">다 했어요 ㅎㅎ<br>보내기 누른 건 1분 안에 나가요</div>`; return; }
    if (cur >= pend.length) cur = pend.length-1; if (cur < 0) cur = 0;
    $('#list').innerHTML = `<div class="nav"><button data-nav="-1" ${cur?'':'disabled'}>◀ 이전</button><span>${cur+1} / ${pend.length} 남음</span><button data-nav="1" ${cur<pend.length-1?'':'disabled'}>다음 ▶</button></div>` + redo + card(pend[cur]);
    return;
  }
  const want = {done:['sent','approved','sending'], skip:['skip']}[tab];
  const items = (S.items||[]).filter(x => want.includes(x.status)).sort((a,b)=>(b.u||0)-(a.u||0));
  $('#list').innerHTML = items.length ? items.map(card).join('') : '<div class="empty">없어요</div>';
}
const find = el => { const c = el.closest('.card'); return [c, (S.items||[]).find(x=>x.id===c.dataset.id)]; };
async function saveLines(it, lines, redraw=true){ it.lines = lines; dirty[it.id] = lines; if (redraw) render(); await save(it, redraw); }
const readLines = c => [...c.querySelectorAll('.ln input')].map(i=>i.value);
document.addEventListener('focusin', e => { if (e.target.matches('.ln input, .memo textarea')) editing = true; });
document.addEventListener('focusout', e => { if (e.target.matches('.memo textarea')) editing = false; });
document.addEventListener('focusout', e => { if (e.target.matches('.ln input')) { editing = false;
  const [c,it] = find(e.target); if (it) { const L = readLines(c); if (JSON.stringify(L) !== JSON.stringify(it.lines)) saveLines(it, L.filter(x=>x.trim()), false); } } });
document.addEventListener('input', e => { if (e.target.matches('.ln input')) { const [c,it]=find(e.target); c.querySelector('.score').textContent = score(readLines(c)); } });
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.dataset.t){ tab = t.dataset.t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b===t)); render(); return; }
  if (t.dataset.nav){ cur += +t.dataset.nav; render(); window.scrollTo(0,0); return; }
  if (!t.closest('.card')) return;
  const [c,it] = find(t); if (!it) return;
  if (t.dataset.del !== undefined){ const L = readLines(c); L.splice(+t.dataset.del,1); await saveLines(it, L.filter(x=>x.trim())); return; }
  if (t.classList.contains('add')){ it.lines = readLines(c); it.lines.push(''); dirty[it.id] = it.lines; render();
    const ins = document.querySelectorAll(`.card[data-id="${CSS.escape(it.id)}"] .ln input`); ins[ins.length-1]?.focus(); return; }
  if (t.classList.contains('go')){
    const L = readLines(c).map(x=>x.trim()).filter(Boolean);
    if (!L.length) return alert('보낼 줄이 없어요');
    it.lines = L; it.status = 'approved'; t.disabled = true; t.textContent = '올리는 중…';
    await save(it); return; }
  if (t.classList.contains('memogo')){
    const m = c.querySelector('.memo textarea').value.trim();
    if (!m) return alert('메모를 적어 주세요');
    it.lines = readLines(c).filter(x=>x.trim()); it.memo = m; it.memoAt = Date.now(); it.status = 'memo';
    t.disabled = true; t.textContent = '넘기는 중…'; await save(it); return; }
  if (t.classList.contains('undo')){ it.status = 'draft'; await save(it); return; }
  if (t.classList.contains('skip')){ it.lines = readLines(c); it.status = 'skip'; await save(it); return; }
});
document.addEventListener('toggle', e => { const c = e.target.querySelector && e.target.querySelector('.chat'); if (c) c.scrollTop = c.scrollHeight; }, true);
pull(); setInterval(pull, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
</script></body></html>
